<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HorárioJá — Sistema de Agendamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',
              400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',
              800:'#115e59',900:'#134e4a'
            },
            destaque: {
              50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',
              400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309'
            },
            neutro: {
              0:'#ffffff',50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',
              300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',
              700:'#334155',800:'#1e293b',900:'#0f172a'
            }
          },
          fontFamily: {
            display:['Outfit','sans-serif'],
            body:['Figtree','sans-serif']
          },
          boxShadow: {
            'sm':'0 1px 2px 0 rgb(15 23 42 / 0.04)',
            'md':'0 4px 12px -2px rgb(15 23 42 / 0.06), 0 2px 4px -2px rgb(15 23 42 / 0.04)',
            'lg':'0 12px 28px -6px rgb(15 23 42 / 0.08), 0 4px 10px -4px rgb(15 23 42 / 0.04)',
            'xl':'0 20px 50px -10px rgb(15 23 42 / 0.12), 0 8px 16px -6px rgb(15 23 42 / 0.05)'
          },
          borderRadius: {
            '2xl':'1rem','3xl':'1.25rem'
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeSlideIn {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    [data-tela]:not(.hidden) {
      animation: fadeSlideIn .35s ease-out;
    }
    .ativo {
      background:#f0fdfa !important;
      color:#0d9488 !important;
      font-weight:600;
      box-shadow:inset 3px 0 0 #0d9488;
    }
    .ativo svg { stroke:#0d9488 !important; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:#94a3b8; }
    :focus-visible {
      outline:2px solid #2dd4bf;
      outline-offset:2px;
      border-radius:4px;
    }
    .badge {
      display:inline-flex;align-items:center;justify-content:center;
      padding:2px 10px;border-radius:9999px;font-size:0.75rem;
      font-weight:600;font-family:'Figtree',sans-serif;letter-spacing:.01em;
    }
    .card {
      background:#fff;border-radius:1rem;
      box-shadow:0 4px 12px -2px rgb(15 23 42 / .06),0 2px 4px -2px rgb(15 23 42 / .04);
      border:1px solid #e2e8f0;
    }
    .btn {
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 20px;border-radius:.75rem;font-weight:600;font-size:.875rem;
      font-family:'Figtree',sans-serif;cursor:pointer;border:none;
      transition:all .2s ease;
    }
    .btn-primary { background:#0d9488;color:#fff; }
    .btn-primary:hover { background:#0f766e;transform:translateY(-1px);box-shadow:0 4px 12px -2px rgb(13 148 136/.3); }
    .btn-secondary { background:#f1f5f9;color:#334155; }
    .btn-secondary:hover { background:#e2e8f0; }
    .btn-ghost { background:transparent;color:#64748b; }
    .btn-ghost:hover { background:#f1f5f9;color:#334155; }
    .btn-danger { background:#fef2f2;color:#dc2626; }
    .btn-danger:hover { background:#fee2e2; }
    .btn-accent { background:#f59e0b;color:#fff; }
    .btn-accent:hover { background:#d97706; }
    @keyframes toastIn  { from{opacity:0;transform:translateX(120%);}to{opacity:1;transform:translateX(0);} }
    @keyframes toastOut { from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(120%);} }
    .toast-enter { animation:toastIn .35s ease-out forwards; }
    .toast-exit  { animation:toastOut .3s ease-in forwards; }
    @keyframes modalIn { from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);} }
    .modal-animate { animation:modalIn .25s ease-out; }
    @keyframes spin {
      to { transform:rotate(360deg); }
    }
    .animate-spin-slow { animation:spin 1.5s linear infinite; }
  </style>
</head>
<body class="bg-neutro-50 font-body text-neutro-800 antialiased">

  <!-- ═══ UTILITÁRIOS ═══ -->

  <!-- Toast Container -->

  <!-- Modal -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-[100] bg-black/40 backdrop-blur-sm flex items-center justify-center p-6" onclick="fecharModal()">
    <div id="modal-card" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col modal-animate" onclick="event.stopPropagation()">

        <h3 id="modal-title" class="font-display font-700 text-lg text-neutro-900"></h3>
        <button onclick="fecharModal()" class="p-1.5 rounded-lg text-neutro-400 hover:text-neutro-600 hover:bg-neutro-100 transition-all">

        </button>
      </div>
      <div id="modal-body" class="p-6 overflow-y-auto"></div>
    </div>
  </div>

  <!-- ═══ SCRIPTS ═══ -->
  <script>
    // ── Roteador ──
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }

    // ── Toast ──
    var toastTimer = null;
    function toast(mensagem, tipo) {
      var container = document.getElementById('toast-container');
      var el = document.createElement('div');
      var cores = {
        ok:   'bg-marca-700 text-white',
        erro: 'bg-red-600 text-white',
        info: 'bg-neutro-800 text-white'
      };
      var icones = {
        ok:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        erro: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
      };
      el.className = 'pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium ' + (cores[tipo] || cores.info);
      el.innerHTML = icones[tipo] + '<span>' + mensagem + '</span>';
      el.classList.add('toast-enter');
      container.appendChild(el);
      setTimeout(function() {
        el.classList.remove('toast-enter');
        el.classList.add('toast-exit');
        setTimeout(function() { el.remove(); }, 300);
      }, 3000);
    }

    // ── Modal ──
    function abrirModal(html, titulo) {
      document.getElementById('modal-title').textContent = titulo || '';
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function fecharModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    // ── Formatadores ──
    function brl(valor) {
      return 'R$ ' + Number(valor).toFixed(2).replace('.', ',');
    }
    function dataBR(iso) {
      if (!iso) return '—';
      var d = new Date(iso + 'T00:00:00');
      var dd = String(d.getDate()).padStart(2, '0');
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var yyyy = d.getFullYear();
      return dd + '/' + mm + '/' + yyyy;
    }

    // ── Inicialização ──
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('agendar-horario');
    });
  </script>

</body>
</html>
